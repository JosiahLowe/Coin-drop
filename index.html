<script>
'use strict';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreElement = document.getElementById('score');
const usedElement = document.getElementById('used');
let dropX = 230;
function updateAim() {

const R = 14, THICKNESS = 5, SHELF_HEIGHT = 30, MAX_STACK = 3;

const pusherAt = t => 232 - 25 * Math.cos(t * 1.55);
const combat = new DungeonCombat(dungeon, amount => {
  score += amount; scoreElement.textContent = score;
}, state => {
  const health = state.health;
  const hearts = document.getElementById('hearts');

  hearts.setAttribute('aria-label', health.hearts + ' of 3 hearts');

function coin(x, y, z = 0) {

function reset() {

  for (const i of [14, 33, 73, 110]) {

function drop() {

  const c = coin(dropX, BACK + R + 6, SHELF_HEIGHT + 85);

  coins.push(c); score--; scoreElement.textContent = score; used++; usedElement.textContent = used;
}
function surfaceAt(c) {

// Build a bottom-to-top support tree. Every coin weighs one unit; the

function updateStackLoads() {

    if (c.falling || Math.abs(c.vz) > 1) continue;

// Approximate disc balance: the rim can support an overhang when a quarter

    if (upperEdge && !queue.some(b => Math.abs(b.x - c.x) < R * 2)) continue;

function simulate(dt) {

    if (c.falling && (c.z < -65 || c.y > EDGE + 65)) {

function drawCoin(c) {

function speedLabel() { return Math.sin(time * 1.55) >= 0 ? 'FORWARD · PUSHING THE LOWER PILE ↓' : 'RETURN · MAKING ROOM AT THE BACK'; }
function draw() {

  ctx.fillStyle = '#8fab83'; ctx.fillRect(LEFT, BACK - 12, RIGHT - LEFT, 5);
  ctx.fillStyle = '#101e16'; ctx.fillRect(LEFT + R, BACK - 30, RIGHT - LEFT - R * 2, 7);
  ctx.fillStyle = '#ecca72'; ctx.fillRect(dropX - 10, BACK - 33, 20, 12);
  ctx.strokeStyle = '#ecca7280'; ctx.setLineDash([3, 4]);
  ctx.beginPath(); ctx.moveTo(dropX, BACK - 18); ctx.lineTo(dropX, BACK + R + 6 - SHELF_HEIGHT * .38); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#395a3e'; ctx.fillRect(LEFT, pusherY - 12, RIGHT - LEFT, 12);
  ctx.fillStyle = 'rgb(' + Math.round(208 + 9 * bumpFlash) + ',' + Math.round(223 + 7 * bumpFlash) + ',' + Math.round(181 + 7 * bumpFlash) + ')'; ctx.fillRect(LEFT, pusherY - 14, RIGHT - LEFT, 3);
  ctx.fillStyle = '#d1dfbb'; ctx.font = '9px sans-serif'; ctx.fillText('DROP AT THE BACK', 230, BACK - 42);
  for (const c of sorted) if (c.z >= SHELF_HEIGHT - 1) drawCoin(c);
  ctx.fillStyle = '#a8ba9b'; ctx.font = '10px sans-serif'; ctx.fillText(speedLabel(), 230, 35);
  ctx.save(); ctx.translate(30, (pusherAt(0) + EDGE) / 2); ctx.rotate(-Math.PI / 2); ctx.font = '9px sans-serif'; ctx.fillText('LOWER DECK', 0, 0); ctx.restore();
  ctx.fillStyle = '#afc58c'; ctx.fillRect(LEFT, EDGE, RIGHT - LEFT, 3);
  ctx.strokeStyle = '#506b45'; ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.moveTo(LEFT + 8, EDGE + 35); ctx.lineTo(RIGHT - 8, EDGE + 35); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#bed09f'; ctx.font = '10px sans-serif'; ctx.fillText('↓ COLLECTION TRAY ↓', 230, EDGE + 86);
  for (const p of particles) { ctx.globalAlpha = p.life; ctx.fillStyle = '#ffe09a'; ctx.font = 'bold 17px sans-serif'; ctx.fillText('+1', p.x, p.y); }
  ctx.globalAlpha = 1;
}
function frame(now) {
  if (lastTime !== null) accumulator += Math.min((now - lastTime) / 1000, .05);
  lastTime = now;
  while (accumulator >= STEP) { simulate(STEP); dungeon.update(STEP); combat.update(STEP); accumulator -= STEP; }
  updateAim(); draw(); dungeon.draw(); requestAnimationFrame(frame);
}
document.getElementById('restart').addEventListener('click', () => { combat.restart(); updateAim(); document.getElementById('restart').blur(); });
document.getElementById('drop').addEventListener('click', drop);
document.getElementById('reset').addEventListener('click', reset);
document.addEventListener('visibilitychange', () => { lastTime = null; accumulator = 0; dungeon.clearInput(); });
reset(); requestAnimationFrame(frame);
</script>
