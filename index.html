<script>
'use strict';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreElement = document.getElementById('score');
const usedElement = document.getElementById('used');
let gamePaused=false;
let dropX = 230;
function updateAim() {
  dropX = Math.max(LEFT + R, Math.min(RIGHT - R, dungeon.x));
}
const R = 14, THICKNESS = 5, SHELF_HEIGHT = 30, MAX_STACK = 3;
const EDGE = 389, LEFT = 49, RIGHT = 411, BACK = 110, STEP = 1 / 120;
const dungeon = new DungeonWalkway(document.getElementById('dungeon'), LEFT, RIGHT);
const STARTING_COINS = 0;
const MANUAL_DROP_CONFIG = { cooldown:.15 };
let manualDropRemaining=0;
let coins = [], score = STARTING_COINS, used = 0, time = 0;
let pendingCoinDrops = [];
let machineReady=false;
let startingPlans=[],startingFallbacks=[];
const loot=new PhysicalLoot(message=>{
  const notice=document.getElementById('loot-notice');notice.textContent=message;notice.hidden=!message;
},amount=>{score+=amount;scoreElement.textContent=score;refreshDropButton();});
const radiusOf = c => c.radius || R;
let pusherY = 207, accumulator = 0, lastTime = null, particles = [];
let bumpUsed = false, bumpFlash = 0;
const pusherAt = t => 232 - 25 * Math.cos(t * 1.55);
const combat = new DungeonCombat(dungeon, x => {
  const reward=rollEnemyReward(loot.random);
  if(reward.kind==='coin'){pendingCoinDrops.push(x);flushCoinDrops();}
  else {loot.pending.push({id:'drop-'+loot.nextId++,type:reward.type,debris:reward.kind==='debris',entryX:x});flushLootDrops();}
}, state => {
  const health = state.health;
  const hearts = document.getElementById('hearts');
  const healthText = '♥ '.repeat(health.hearts) + '♡ '.repeat(3 - health.hearts);
  if (hearts.textContent !== healthText) {
    hearts.textContent = healthText;
    hearts.setAttribute('aria-label', health.hearts + ' of 3 hearts');
  }
  document.getElementById('game-over').hidden = !health.dead;
  refreshDropButton(state);
  if(machineReady)loot.observeWave(state.waves.wave);
  document.getElementById('potion-count').textContent=state.runLoot.potions;
  document.getElementById('potion').disabled=health.dead||gamePaused||!state.runLoot.potions||health.hearts>=health.config.hearts;
  document.getElementById('armor-count').textContent='◇ '+state.runLoot.armor;
  document.getElementById('sword-level').textContent='† '+state.runLoot.swordLevel+'/5';
  const waves = state.waves;
  const message = 'STAGE ' + waves.wave + (state.powerups.label?' · '+state.powerups.label:'');
  const status = document.getElementById('wave-status');
  if (status.textContent !== message) status.textContent = message;
  for (const button of dungeon.buttons) button.disabled = health.dead;
});
combat.awardStoredCoins=amount=>{score+=amount;scoreElement.textContent=score;refreshDropButton();};
loot.applyReward=type=>combat.applyLoot(type);
loot.isPaused=()=>gamePaused;
loot.canCollect=body=>body.y>EDGE&&(body.z < -65 || body.y > EDGE+65);
document.getElementById('potion').addEventListener('click',()=>{combat.runLoot.usePotion(combat);document.getElementById('potion').blur();});
window.addEventListener('keydown',e=>{if(e.code==='KeyH'&&!e.repeat&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.target.matches('input,textarea,select,[contenteditable=true]')){e.preventDefault();combat.runLoot.usePotion(combat);}});
function coin(x, y, z = 0) {
  return { x, y, z, vx: 0, vy: 0, vz: 0, angle: Math.random() * Math.PI * 2, falling: false, tip: 0, pinned: false, load: 1, support: null, stackLevel: 0, bumpImpulse: 0, bumpElapsed: 0 };
}
function reset() {
  manualDropRemaining=0;
  time = 0; pusherY = pusherAt(0); coins = []; particles = []; pendingCoinDrops = []; loot.pending = [];
  startingPlans=planStartingItems();
  updateAim();
  bumpUsed = false; bumpFlash = 0;
  // Leave one quarter of the grid empty to relieve initial pile pressure.
  const spacing = R * 2 + .5;
  const rowSpacing = spacing * Math.sqrt(3) / 2;
  function fillSurface(firstY, lastY, z) {
    for (let row = 0, y = firstY; y <= lastY; row++, y += rowSpacing) {
      const offset = row % 2 ? spacing / 2 : 0;
      let column=0;
      for (let x = LEFT + R + offset; x <= RIGHT - R; x += spacing) {
        const leaveLootPocket=z===0 && (Math.hypot(x-230,y-(EDGE-24))<40 || Math.hypot(x-110,y-340)<36);
        if((row+column++)%4!==0 && !leaveLootPocket && !startingPlans.some(p=>Math.hypot(p.x-x,p.y-y)<p.radius+R+1))coins.push(coin(x, y, z));
      }
    }
  }
  fillSurface(BACK + R, pusherY - R * .75, SHELF_HEIGHT);
  populateLowerClutter();
  score = STARTING_COINS; used = 0; accumulator = 0;
  scoreElement.textContent = score;refreshDropButton(); usedElement.textContent = '0';
}
// Shared normal rear entry for manual and enemy-generated coins.
function spawnCoin(x) {
  if(gamePaused)return false;
  if (coins.length >= 180) return false;
  const c = coin(Math.max(LEFT + R, Math.min(RIGHT - R, x)), BACK + R + 6, SHELF_HEIGHT + 85);
  c.vx = 0; c.vy = 0;
  coins.push(c); used++; usedElement.textContent = used;
  return true;
}
function flushCoinDrops() {
  if(gamePaused)return;
  // Retain earned drops at the active-coin cap rather than losing rewards
  // or changing the bounded physics workload. Restart preserves this queue.
  while (pendingCoinDrops.length && coins.length < 180) {
    spawnCoin(pendingCoinDrops.shift());
  }
}
function refreshDropButton(state=combat){
  document.getElementById('drop').disabled=gamePaused||state.health.dead||score<1||manualDropRemaining>1e-8||coins.length>=180;
}
function updateManualDrop(dt){
  if(gamePaused||combat.health.dead)return;
  manualDropRemaining=Math.max(0,manualDropRemaining-dt);refreshDropButton();
}
function drop() {
  if (gamePaused || combat.health.dead || score < 1 || manualDropRemaining>1e-8) return false;
  updateAim();
  if (!spawnCoin(dropX)) return;
  score--; scoreElement.textContent = score;refreshDropButton();
  manualDropRemaining=MANUAL_DROP_CONFIG.cooldown;refreshDropButton();return true;
}
function planStartingItems(){
 const plans=[];
 for(const type of ['potion','sword','armor','chest']){
  const d=LOOT_TYPES[type],radius=Math.hypot(d.width,d.height)/2;
  for(let i=0;i<500;i++){
   const x=LEFT+radius+2+Math.random()*(RIGHT-LEFT-2*radius-4),y=290+radius+Math.random()*(EDGE-2*radius-302);
   if(Math.hypot(x-110,y-340)<radius+22||plans.some(p=>Math.hypot(x-p.x,y-p.y)<radius+p.radius+3))continue;
   plans.push({type,x,y,radius});break;
  }
 }
 return plans;
}
function flushLootDrops(){
 if(gamePaused)return;
 for(let index=0;index<loot.pending.length&&coins.length<180;){
  const spec=loot.pending[index],d=spec.debris?DEBRIS_TYPES[spec.type]:LOOT_TYPES[spec.type],radius=spec.debris?Math.max(...d.vertices.map(v=>Math.hypot(...v))):Math.hypot(d.width,d.height)/2;
  let x,y,z;
  if(spec.entryX!==undefined){
   x=Math.max(LEFT+radius,Math.min(RIGHT-radius,spec.entryX));y=BACK+radius+6;z=SHELF_HEIGHT+85;
   if(coins.some(c=>Math.abs(c.z-z)<THICKNESS&&Math.hypot(c.x-x,c.y-y)<radius+radiusOf(c))) {index++;continue;}
  }else if(spec.starting){
   if(spec.retryAt!==undefined&&time<spec.retryAt){index++;continue;}
   const planned=startingPlans.find(p=>p.type===spec.type);
   const candidates=planned?[planned]:[];
   for(let i=0;i<250;i++)candidates.push({x:LEFT+radius+1+Math.random()*(RIGHT-LEFT-2*radius-2),y:pusherAt(0)+50+radius+3+Math.random()*(EDGE-pusherAt(0)-50-2*radius-12)});
   candidates.push(...startingFallbacks);
   const spot=candidates.find(p=>p.x>=LEFT+radius&&p.x<=RIGHT-radius&&p.y>pusherY+radius&&p.y<EDGE-radius-5&&Math.hypot(p.x-110,p.y-340)>radius+22&&!coins.some(c=>Math.abs(c.z)<THICKNESS&&Math.hypot(c.x-p.x,c.y-p.y)<radius+radiusOf(c)+.2));
   if(!spot){spec.retryAt=time+.5;index++;continue;}
   x=spot.x;y=spot.y;z=0;
  }else{x=LEFT+radius+(RIGHT-LEFT-2*radius)*(spec.lane??.5);y=EDGE-radius-6;z=15;}
  const body=spec.debris?debrisBody(spec.type,x,y):coin(x,y,z);
  Object.assign(body,{z,id:spec.id,radius,mass:d.mass,resistance:d.friction,starting:!!spec.starting});if(!spec.debris)body.loot=spec.type;coins.push(body);
  loot.pending.splice(index,1);
 }
}
function restartStartingLoot(){
 startingFallbacks=coins.filter(c=>c.starting).map(c=>({x:c.x,y:c.y}));
 coins=coins.filter(c=>!c.starting);startingPlans=[];loot.seedStarting();flushLootDrops();
}
function surfaceAt(c) {
  if (c.y > EDGE) return -Infinity;
  if (c.y <= pusherY && c.y >= BACK) return SHELF_HEIGHT;
  return 0;
}
// Build a bottom-to-top support tree. Every coin weighs one unit; the
// bottom quarter carries the total load of all quarters resting above it.
function updateStackLoads() {
  const ordered = coins.slice().sort((a, b) => a.z - b.z);
  for (const c of ordered) {
    c.support = null; c.load = c.mass || 1; c.stackLevel = 0;
    if (c.falling || Math.abs(c.vz) > 1) continue;
    let closest = Infinity;
    for (const b of ordered) {
      if (b === c || b.falling || Math.abs(b.vz) > 1 || b.stackLevel >= MAX_STACK - 1) continue;
      if (Math.abs(c.z - b.z - THICKNESS) > .6) continue;
      const distance = Math.hypot(c.x - b.x, c.y - b.y);
      if (distance < (radiusOf(c)+radiusOf(b)) * .625 && distance < closest && supportFootprint(c,b)) { c.support = b; closest = distance; }
    }
    if (c.support) c.stackLevel = c.support.stackLevel + 1;
  }
  for (let i = ordered.length - 1; i >= 0; i--) {
    const c = ordered[i];
    if (c.support) c.support.load += c.load;
  }
}
// Approximate disc balance: the rim can support an overhang when a quarter
// resting on its rear half puts the combined center of mass behind the lip.
function edgeBalance(c, bodies, dt) {
  const onUpper = Math.abs(c.previousZ - SHELF_HEIGHT) < .6;
  const height = onUpper ? SHELF_HEIGHT : 0;
  const lip = onUpper ? pusherY : EDGE;
  if (Math.abs(c.previousZ - height) > .6 || c.y <= lip || c.y >= lip + radiusOf(c) * .9) return null;
  let weight = c.mass || 1, moment = (c.y - lip) * weight;
  for (const b of bodies) {
    if (b === c || b.falling || Math.abs(b.previousVz) > 1) continue;
    // Include the full supported stack, including a third quarter. Forward
    // weight can destabilize an overhang just as rear weight can hold it.
    let parent = b.support;
    while (parent && parent !== c) parent = parent.support;
    if (parent !== c) continue;
    weight += b.mass || 1; moment += (b.y - lip) * (b.mass || 1);
  }
  const pinned = weight > 1 && moment / weight <= -.5;
  c.pinned = pinned;
  if (pinned) {
    c.tip = 0;
    return height;
  }
  // Briefly rotate around the lip, then release into gravity. This delay is
  // tied to support loss, not a random timer, so removing a counterweight matters.
  c.tip = Math.min(1, c.tip + dt / .24);
  return c.tip < 1 ? height : null;
}
// Transmit one short mechanical jolt through a touching lower pile, rather
// than shaking disconnected coins or applying a free payout on every stroke.
function forwardBump(contacts, speed) {
  if (!contacts.size || speed <= 0) return false;
  const connected = new Set(contacts), queue = [...contacts];
  const lower = coins.filter(c => !c.falling && c.z < SHELF_HEIGHT - 1 && Math.abs(c.vz) < 1);
  for (let i = 0; i < queue.length; i++) {
    const a = queue[i];
    for (const b of lower) {
      if (connected.has(b) || Math.abs(a.z - b.z) >= THICKNESS) continue;
      if (Math.hypot(a.x - b.x, a.y - b.y) <= radiusOf(a) + radiusOf(b) + 2) {
        connected.add(b); queue.push(b);
      }
    }
  }
  // A lone quarter offers little resistance. Count the connected pile and
  // its supported weight, without counting a supported coin twice.
  const contactLoad = queue.reduce((total, c) => {
    let base = c.support;
    while (base) {
      if (connected.has(base)) return total;
      base = base.support;
    }
    return total + c.load;
  }, 0);
  const loadStrength = Math.min(1, (contactLoad / 12) ** 2);
  const strength = Math.min(1, speed / 38.75) * loadStrength;
  for (const c of coins) {
    if (c.falling || Math.abs(c.vz) > 1) continue;
    const upperEdge = c.z >= SHELF_HEIGHT && c.y > pusherY - R * 2 && c.y < pusherY + R;
    const lowerEdge = connected.has(c) && c.y >= EDGE - R * 2;
    if (!upperEdge && !lowerEdge) continue;
    // The returning load also jolts the upper lip, above the contact columns.
    if (upperEdge && !queue.some(b => Math.abs(b.x - c.x) < R * 2)) continue;
    const lane = .65 + .35 * Math.abs(Math.sin(c.x * .047 + Math.floor(time / 4.05) * 1.37));
    // Spread a smaller nudge over 140 ms instead of snapping velocity in
    // one frame. The smooth pulse still loosens coins already near the lip.
    c.bumpImpulse = (upperEdge ? 85 : 55) * strength * lane / Math.sqrt(c.load);
    c.bumpElapsed = 0;
  }
  bumpFlash = loadStrength;
  return true;
}
function simulate(dt) {
  if(gamePaused)return;
  updateStackLoads();
  time += dt;
  const previousShelfY = pusherY;
  const next = pusherAt(time), delta = next - pusherY, speed = delta / dt;
  pusherY = next;
  if (speed <= 0) bumpUsed = false;
  bumpFlash = Math.max(0, bumpFlash - dt * 7);
  const faceContacts = new Set();
  for (const c of coins) {
    // Test contact against the previous shelf position, then carry the coin
    // by the full displacement in BOTH directions before checking support.
    // The rear wall may compress a crowded pile; an isolated coin stays put
    // relative to the bed throughout the entire cycle.
    c.carryY = 0;
    const grounded = !c.falling && Math.abs(c.vz) < 1;
    if (grounded && Math.abs(c.z - SHELF_HEIGHT) < .1 && c.y <= previousShelfY && c.y >= BACK) {
      c.carryY = delta; c.y += c.carryY;
    }
    if (c.bumpImpulse > 0) {
      const before = Math.min(1, c.bumpElapsed / .14);
      c.bumpElapsed += dt;
      const after = Math.min(1, c.bumpElapsed / .14);
      // Integral of a half-sine pulse, so acceleration starts and ends gently.
      c.vy += c.bumpImpulse * (Math.cos(before * Math.PI) - Math.cos(after * Math.PI)) * .5;
      if (after === 1) c.bumpImpulse = 0;
    }
    // Dry friction stops coins decisively instead of letting them coast forever.

function drawCoin(c) {
  if(c.debris){drawDebris(ctx,c);return;}
  if(c.token){drawToken(c);return;}
  if(c.loot){drawLoot(ctx,c);return;}

  ctx.strokeStyle = '#ffe7a4'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, R - 2, 0, Math.PI * 2); ctx.stroke();

const TOKEN_CONFIG={radius:21,mass:3,edgeInset:28,x:110,dropHeight:85};

 if(!tokenDropIn)for(let y=EDGE-r-TOKEN_CONFIG.edgeInset;y>pusherAt(0)+50+r;y-=8){

function collectToken(c){

function drawToken(c){

function setPaused(value){

document.getElementById('pause').addEventListener('click',()=>setPaused(!gamePaused));

window.addEventListener('keydown',e=>{if(!e.repeat&&(e.code==='Escape'||e.code==='KeyP')){e.preventDefault();setPaused(!gamePaused);}});
function frame(now) {

document.getElementById('restart').addEventListener('click', () => { setPaused(false);combat.restart();restartStartingLoot();manualDropRemaining=0;refreshDropButton();resetToken(); updateAim(); document.getElementById('restart').blur(); });
const dropButton=document.getElementById('drop');
