<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101c17">
<title>COIN DROP</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101c17;color:#edf3e5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding: max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}main{width:min(100%,440px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.label{font-size:10px;letter-spacing:.18em;color:#9bac99}h1{font-size:36px;letter-spacing:-.055em;margin:5px 0}h1 span{color:#ecca72}.stats{display:flex;justify-content:space-between;padding:0 3px 14px}.score{text-align:right}output{display:block;font-size:32px;color:#ecca72;font-weight:700;font-variant-numeric:tabular-nums}.machine{border:1px solid #425743;border-radius:20px;overflow:hidden;background:#19291f;box-shadow:0 22px 60px #0003}.bar{display:flex;justify-content:space-between;padding:13px 16px;border-bottom:1px solid #344b37;font-size:10px;letter-spacing:.15em;color:#a7baa0}.live{color:#cae9ae}canvas{display:block;width:100%;height:auto;aspect-ratio:460/540}.controls{display:grid;grid-template-columns:1fr 64px;gap:10px;margin-top:16px}button{min-height:58px;border:0;border-radius:13px;font:inherit;font-weight:750;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}#drop{background:#ecca72;color:#243019;letter-spacing:.1em;box-shadow:0 4px #967638}#drop:active{background:#f9db8e}#reset{background:#2a3e2d;color:#e5eddb;font-size:26px}button:focus-visible{outline:3px solid white;outline-offset:4px}.hint{text-align:center;font-size:12px;color:#9bac99;line-height:1.7;margin:17px 0}footer{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.13em;color:#73876e;margin-top:20px}@media(max-height:740px){main{max-width:350px}header{margin-bottom:10px}h1{font-size:30px}footer{margin-top:12px}.hint{margin:12px 0}}

.aim { padding: 10px calc(13.69565% - 14px) 0; }
.aim label { display: block; text-align: center; font-size: 10px; letter-spacing: .15em; color: #b9cba9; }
#aim { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 44px; margin: 0; background: transparent; cursor: ew-resize; touch-action: pan-y; }
#aim::-webkit-slider-runnable-track { height: 5px; border-radius: 5px; background: #496047; }
#aim::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -11.5px; border: 3px solid #ffe5a0; border-radius: 50%; background: #d8ae55; box-shadow: 0 2px 5px #0006; }
#aim::-moz-range-track { height: 5px; border-radius: 5px; background: #496047; }
#aim::-moz-range-thumb { box-sizing: border-box; width: 28px; height: 28px; border: 3px solid #ffe5a0; border-radius: 50%; background: #d8ae55; }
#aim:focus-visible { outline: 2px solid #ffe5a0; outline-offset: 2px; border-radius: 10px; }
</style>
</head>
<body>
<main>
<header><div><div class="label">POCKET ARCADE / 001</div><h1>COIN DROP<span>.</span></h1></div></header>
<div class="stats" aria-label="Game counters"><div><span class="label">USED</span><output id="used" aria-label="Tokens dropped">0</output></div><div class="score"><span class="label">COLLECTED</span><output id="score" aria-label="Collected coins">0</output></div></div>
<section class="machine" aria-label="Coin pusher machine"><div class="bar"><span>TOP VIEW</span><span class="live">● IN PLAY</span></div><div class="aim"><label for="aim">DRAG TO AIM</label><input id="aim" type="range" min="63" max="397" step="1" value="230" aria-label="Coin drop position" aria-valuetext="Center"></div><canvas id="game" width="460" height="540" aria-label="Top-down, two-level coin pusher. Drop quarters on the upper shelf, build overlapping piles, and push coins off the lower deck.">Use Drop Coin to play.</canvas></section>
<div class="controls"><button id="drop" type="button">＋ DROP COIN</button><button id="reset" type="button" aria-label="Reset game" title="Reset game">↺</button></div>
<p class="hint">Slide to aim. Tap to drop. Work the pile.<br>Every coin off the lower deck earns a point.</p>
<footer><span>NO TOKENS REQUIRED</span><span>JUST ONE MORE DROP ↗</span></footer>
</main>
<script>
'use strict';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreElement = document.getElementById('score');
const usedElement = document.getElementById('used');
const aimElement = document.getElementById('aim');
let dropX = Number(aimElement.value);
function updateAim() {
  dropX = Number(aimElement.value);
  const percent = Math.round((dropX - 63) / 334 * 100);
  aimElement.setAttribute('aria-valuetext', percent === 50 ? 'Center' : percent + '% from left');
}
aimElement.addEventListener('input', updateAim);
const R = 14, THICKNESS = 5, SHELF_HEIGHT = 30;
const EDGE = 445, LEFT = 49, RIGHT = 411, BACK = 110, STEP = 1 / 120;
let coins = [], score = 0, used = 0, time = 0;
let pusherY = 235, accumulator = 0, lastTime = null, particles = [];
const pusherAt = t => 260 - 25 * Math.cos(t * 1.55);
function coin(x, y, z = 0) {
  return { x, y, z, vx: 0, vy: 0, vz: 0, angle: Math.random() * Math.PI * 2, falling: false };
}
function reset() {
  time = 0; pusherY = pusherAt(0); coins = []; particles = [];
  aimElement.value = '230'; updateAim();
  for (let row = 0; row < 2; row++) {
    for (let col = 0; col < 10; col++) coins.push(coin(87 + col * 31, 177 + row * 30, SHELF_HEIGHT));
  }
  for (let row = 0; row < 4; row++) {
    for (let col = 0; col < 8; col++) coins.push(coin(99 + col * 37 + (row % 2) * 6, 316 + row * 32));
  }
  // A few overlapping coins make the height of the starting piles visible.
  for (const i of [22, 34, 45]) {
    const base = coins[i]; coins.push(coin(base.x + 7, base.y + 4, THICKNESS));
  }
  score = 0; used = 0; accumulator = 0;
  scoreElement.textContent = '0'; usedElement.textContent = '0';
}
function drop() {
  if (coins.length >= 180) return;
  const c = coin(dropX, BACK + R + 6, SHELF_HEIGHT + 85);
  c.vx = 0; c.vy = 0;
  coins.push(c); used++; usedElement.textContent = used;
}
function surfaceAt(c) {
  if (c.y > EDGE + R * .4) return -Infinity;
  if (c.y <= pusherY && c.y >= BACK) return SHELF_HEIGHT;
  return 0;
}
function simulate(dt) {
  time += dt;
  const previousShelfY = pusherY;
  const next = pusherAt(time), delta = next - pusherY, speed = delta / dt;
  pusherY = next;
  for (const c of coins) {
    // Test contact against the previous shelf position, then carry the coin
    // by the full displacement in BOTH directions before checking support.
    // The rear wall may compress a crowded pile; an isolated coin stays put
    // relative to the bed throughout the entire cycle.
    c.carryY = 0;
    const grounded = !c.falling && Math.abs(c.vz) < 1;
    if (grounded && Math.abs(c.z - SHELF_HEIGHT) < .1 && c.y <= previousShelfY && c.y >= BACK) {
      c.carryY = delta; c.y += c.carryY;
    }
    // Dry friction stops coins decisively instead of letting them coast forever.
    const velocity = Math.hypot(c.vx, c.vy);
    const friction = grounded ? 220 : 8;
    const drag = velocity > 0 ? Math.max(0, 1 - friction * dt / velocity) : 0;
    c.vx *= drag; c.vy *= drag;
    c.x += c.vx * dt; c.y += c.vy * dt; c.angle += c.vx * dt / R;
    c.previousZ = c.z;
    c.vz -= 680 * dt; c.z += c.vz * dt;
  }
  // Resolve vertical contacts before planar collisions. A falling quarter can
  // land on the top face of another quarter, rather than being pushed aside.
  const ordered = coins.slice().sort((a, b) => a.z - b.z);
  for (const c of ordered) {
    if (c.falling) continue;
    let support = surfaceAt(c), carrier = null;
    if (support > c.previousZ + .6) support = 0;
    for (const b of ordered) {
      if (b === c || b.falling || b.vz < -1) continue;
      const top = b.z + THICKNESS;
      // Small stacks are stable; taller arrivals tip off and resolve sideways.
      const floor = surfaceAt(b);
      if (top > floor + THICKNESS || top > c.previousZ + .6 || top < support) continue;
      if ((b.x - c.x) ** 2 + (b.y - c.y) ** 2 < (R * 1.25) ** 2) { support = top; carrier = b; }
    }
    if (c.z <= support) {
      c.z = support; c.vz = 0;
      if (carrier) {
        // Stacks move with the quarter beneath them, with no artificial drift.
        c.y += carrier.carryY || 0;
        c.carryY = carrier.carryY || 0;
        c.vx = carrier.vx; c.vy = carrier.vy;
      }
    }
    if (c.y > EDGE + R * .4 && c.z <= 1) { c.falling = true; c.vy = Math.max(c.vy, 35); }
  }
  for (let iteration = 0; iteration < 7; iteration++) {
    for (let i = 0; i < coins.length; i++) {
      const a = coins[i]; if (a.falling) continue;
      for (let j = i + 1; j < coins.length; j++) {
        const b = coins[j];
        if (b.falling || Math.abs(a.z - b.z) >= THICKNESS - .3) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        if (Math.abs(dx) >= 2 * R || Math.abs(dy) >= 2 * R) continue;
        const distance = Math.hypot(dx, dy); if (distance >= 2 * R) continue;
        const nx = distance > .001 ? dx / distance : 1, ny = distance > .001 ? dy / distance : 0;
        const overlap = (2 * R - distance) * .5;
        a.x -= nx * overlap; a.y -= ny * overlap; b.x += nx * overlap; b.y += ny * overlap;
        const relative = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (relative < 0) {
          const impulse = -relative * .5;
          a.vx -= impulse * nx; a.vy -= impulse * ny; b.vx += impulse * nx; b.vy += impulse * ny;
        }
      }
    }
    for (const c of coins) {
      if (c.falling) continue;
      if (c.x < LEFT + R) { c.x = LEFT + R; c.vx = Math.max(0, c.vx); }
      if (c.x > RIGHT - R) { c.x = RIGHT - R; c.vx = Math.min(0, c.vx); }
      if (c.z < SHELF_HEIGHT - 1 && c.y - R < pusherY) {
        // The shelf's front face shoves the lower pile on its forward stroke.
        c.y = pusherY + R; c.vy = Math.max(c.vy, speed);
      }
      if (c.z >= SHELF_HEIGHT - 1 && c.y - R < BACK) {
        c.y = BACK + R; c.vy = Math.max(c.vy, 0);
      }
    }
  }
  coins = coins.filter(c => {
    if (c.falling && (c.z < -65 || c.y > 510)) {
      score++; scoreElement.textContent = score;
      particles.push({ x: c.x, y: 489, life: 1 }); return false;
    }
    return true;
  });
  for (const p of particles) { p.life -= dt * 1.6; p.y -= dt * 28; }
  particles = particles.filter(p => p.life > 0);
}
function drawCoin(c) {
  ctx.save();
  const altitude = Math.max(0, c.z);
  const surface = Math.max(0, surfaceAt(c));
  const gap = Math.max(0, c.z - surface);
  // Resting coins cast a close contact shadow on their own deck. Only coins
  // actually in the air have a detached shadow beneath them.
  ctx.fillStyle = gap > THICKNESS * 2 ? '#0003' : '#0006';
  ctx.beginPath(); ctx.ellipse(c.x + 2, c.y - Math.min(altitude, surface) * .38 + 2, R, R * .8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.translate(c.x, c.y - altitude * .38);
  if (c.falling) {
    const scale = Math.max(.3, 1 + c.z / 100); ctx.scale(scale, scale); ctx.globalAlpha = Math.max(0, 1 + c.z / 80);
  }
  // A dark rim and offset face distinguish overlapping quarters from flat coins.
  ctx.fillStyle = '#926b32'; ctx.beginPath(); ctx.arc(0, 3, R, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(c.angle); ctx.shadowColor = '#0008'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 3;
  ctx.fillStyle = '#e6bd62'; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#ffe7a4'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, R - 2, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#956c30'; ctx.font = 'bold 9px sans-serif'; ctx.fillText('25', 0, 3.5); ctx.restore();
}
function speedLabel() { return Math.sin(time * 1.55) >= 0 ? 'FORWARD · PUSHING THE LOWER PILE ↓' : 'RETURN · MAKING ROOM AT THE BACK'; }
function draw() {
  ctx.clearRect(0, 0, 460, 540); ctx.textAlign = 'center';
  ctx.fillStyle = '#253a29';
  for (let x = 25; x < 460; x += 25) for (let y = 20; y < 540; y += 25) ctx.fillRect(x, y, 1, 1);
  ctx.fillStyle = '#21392a'; ctx.fillRect(LEFT, 62, RIGHT - LEFT, EDGE - 62);
  ctx.strokeStyle = '#2c4832'; ctx.lineWidth = 1;
  for (let x = LEFT + 20; x < RIGHT; x += 24) { ctx.beginPath(); ctx.moveTo(x, 65); ctx.lineTo(x, EDGE); ctx.stroke(); }
  ctx.fillStyle = '#101e16'; ctx.fillRect(LEFT, EDGE, RIGHT - LEFT, 68);
  ctx.fillStyle = '#527052'; ctx.fillRect(LEFT - 12, 62, 12, EDGE - 62); ctx.fillRect(RIGHT, 62, 12, EDGE - 62);
  ctx.fillStyle = '#829977'; ctx.fillRect(LEFT - 3, 62, 3, EDGE - 62); ctx.fillRect(RIGHT, 62, 3, EDGE - 62);
  ctx.fillStyle = '#1a2c20'; ctx.fillRect(LEFT, 62, RIGHT - LEFT, 60);
  ctx.fillStyle = '#738c70'; ctx.fillRect(110, 72, 12, 80); ctx.fillRect(338, 72, 12, 80);
  // Draw lower coins behind the raised shelf so its front face occludes them.
  const sorted = coins.slice().sort((a, b) => a.z - b.z || a.y - b.y);
  for (const c of sorted) if (c.z < SHELF_HEIGHT - 1) drawCoin(c);
  ctx.fillStyle = '#0a140c80'; ctx.fillRect(LEFT, pusherY - 10, RIGHT - LEFT, 22);
  ctx.fillStyle = '#63825f'; ctx.fillRect(LEFT, BACK - 12, RIGHT - LEFT, pusherY - BACK);
  // The rear wall and feed slot stay fixed while the shelf slides below.
  ctx.fillStyle = '#8fab83'; ctx.fillRect(LEFT, BACK - 12, RIGHT - LEFT, 5);
  ctx.fillStyle = '#101e16'; ctx.fillRect(LEFT + R, BACK - 30, RIGHT - LEFT - R * 2, 7);
  ctx.fillStyle = '#ecca72'; ctx.fillRect(dropX - 10, BACK - 33, 20, 12);
  ctx.strokeStyle = '#ecca7280'; ctx.setLineDash([3, 4]);
  ctx.beginPath(); ctx.moveTo(dropX, BACK - 18); ctx.lineTo(dropX, BACK + R + 6 - SHELF_HEIGHT * .38); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#395a3e'; ctx.fillRect(LEFT, pusherY - 12, RIGHT - LEFT, 12);
  ctx.fillStyle = '#d0dfb5'; ctx.fillRect(LEFT, pusherY - 14, RIGHT - LEFT, 3);
  ctx.fillStyle = '#d1dfbb'; ctx.font = '9px sans-serif'; ctx.fillText('DROP AT THE BACK', 230, BACK - 42);
  for (const c of sorted) if (c.z >= SHELF_HEIGHT - 1) drawCoin(c);
  ctx.fillStyle = '#a8ba9b'; ctx.font = '10px sans-serif'; ctx.fillText(speedLabel(), 230, 35);
  ctx.save(); ctx.translate(30, 365); ctx.rotate(-Math.PI / 2); ctx.font = '9px sans-serif'; ctx.fillText('LOWER DECK', 0, 0); ctx.restore();
  ctx.fillStyle = '#afc58c'; ctx.fillRect(LEFT, EDGE, RIGHT - LEFT, 3);
  ctx.strokeStyle = '#506b45'; ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.moveTo(LEFT + 8, EDGE + 35); ctx.lineTo(RIGHT - 8, EDGE + 35); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#bed09f'; ctx.font = '10px sans-serif'; ctx.fillText('↓ COLLECTION TRAY ↓', 230, 531);
  for (const p of particles) { ctx.globalAlpha = p.life; ctx.fillStyle = '#ffe09a'; ctx.font = 'bold 17px sans-serif'; ctx.fillText('+1', p.x, p.y); }
  ctx.globalAlpha = 1;
}
function frame(now) {
  if (lastTime !== null) accumulator += Math.min((now - lastTime) / 1000, .05);
  lastTime = now;
  while (accumulator >= STEP) { simulate(STEP); accumulator -= STEP; }
  draw(); requestAnimationFrame(frame);
}
document.getElementById('drop').addEventListener('click', drop);
document.getElementById('reset').addEventListener('click', reset);
document.addEventListener('visibilitychange', () => { lastTime = null; accumulator = 0; });
reset(); requestAnimationFrame(frame);
</script>
</body>
</html>
